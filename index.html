<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>김창혁 ♥ 차유진 결혼합니다</title>
<meta name="description" content="2027년 4월 3일 토요일 오전 11시, 문학의 집·서울">
<!-- 카카오톡·문자로 링크를 보낼 때 뜨는 미리보기 (images/og.jpg 를 올리면 대표 사진이 뜹니다) -->
<meta property="og:type" content="website">
<meta property="og:title" content="김창혁 ♥ 차유진 결혼합니다">
<meta property="og:description" content="2027년 4월 3일 토요일 오전 11시 · 문학의 집·서울">
<meta property="og:image" content="https://i-said-yess-270403.github.io/images/og.jpg">
<meta property="og:url" content="https://i-said-yess-270403.github.io/">
<meta name="theme-color" content="#faf7f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8; --paper:#ffffff; --ink:#141414; --soft:#3f3f3f; --line:#d9dbd6;
    --accent:#1f4a36; --accent-soft:#e8efea; --sun:#141414; --sat:#141414;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#e6e8e4;-webkit-text-size-adjust:100%}
  body{font-family:'Gowun Batang',serif;color:var(--ink);line-height:1.8;
    max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);word-break:keep-all}
  img{display:block;max-width:100%}
  a{color:inherit}
  .en{letter-spacing:.06em}

  /* placeholder for photos not yet uploaded */
  .ph{background:linear-gradient(135deg,#eceeea,#dde1dc);display:flex;align-items:center;justify-content:center;color:#6b6f6a;font-size:12px;letter-spacing:.05em}
  .ph svg{width:28px;height:28px;opacity:.6;margin-bottom:6px}
  .ph .phin{display:flex;flex-direction:column;align-items:center}

  /* cover */
  .cover{position:relative;text-align:center;padding:calc(48px + env(safe-area-inset-top)) 28px 40px}
  .cover .date-top{font-size:15px;color:var(--soft)}
  .cover .date-top b{display:block;font-size:30px;font-weight:400;color:var(--ink);letter-spacing:.12em;margin-bottom:2px}
  .cover .main{margin:28px auto 30px;width:100%;aspect-ratio:3/4;border-radius:200px 200px 6px 6px;overflow:hidden}
  .cover .main img{width:100%;height:100%;object-fit:cover}
  .cover .names{font-size:22px;letter-spacing:.08em}
  .cover .names span{color:var(--accent);margin:0 12px;font-size:18px}
  .cover .meta{margin-top:12px;font-size:15px;color:var(--soft)}

  section{padding:64px 28px;text-align:center;border-top:1px solid var(--line)}
    h2{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:32px;letter-spacing:.04em}
  h2::after{content:'';display:block;width:24px;height:1px;background:var(--accent);margin:14px auto 0}

  /* greeting */
  .poem{font-size:15px;color:var(--soft);margin-bottom:32px;white-space:pre-line}
  .greeting{font-size:15px;white-space:pre-line}
  .parents{margin-top:44px;display:grid;grid-template-columns:1fr 1px 1fr;gap:0 14px;align-items:stretch}
  .parents .sep{background:var(--line)}
  .parents .p{display:flex;flex-direction:column;align-items:center;gap:2px}
  .parents .side{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:6px}
  .parents .pp{font-size:15px;color:var(--ink)}
  .parents .rel{font-size:13px;color:var(--soft)}
  .parents .who{font-size:19px;margin-top:4px}
  .transport a.inline{color:var(--accent);font-size:13px;display:inline-block;margin-top:4px}
  .contact-btn{margin-top:28px}

  /* calendar */
  .cal-head{font-size:16px;margin-bottom:18px;font-weight:700}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:10px;font-size:14px;max-width:320px;margin:0 auto;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cal .dow{font-size:13px;color:var(--soft);font-weight:700}
  .cal .d{height:34px;display:flex;align-items:center;justify-content:center}
  .cal .sun{color:var(--sun)} .cal .sat{color:var(--sat)}
  .cal .on span{background:var(--accent);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
  .dday{margin-top:30px;font-size:15px}
  .count{display:flex;justify-content:center;gap:14px;margin-top:16px}
  .count div{min-width:56px}
  .count b{display:block;font-size:24px;font-weight:700;color:var(--accent)}
  .count small{font-size:12px;color:var(--soft)}
  .dday em{font-style:normal;color:var(--accent)}

  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .gallery button{border:0;padding:0;aspect-ratio:1;overflow:hidden;cursor:pointer;background:none}
  .gallery img,.gallery .ph{width:100%;height:100%;object-fit:cover}
  .more{margin-top:18px}
  .lb{position:fixed;inset:0;background:rgba(20,18,16,.94);display:none;z-index:50;flex-direction:column;justify-content:center;align-items:center}
  .lb.open{display:flex}
  .lb .stage{width:100%;max-width:440px;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
  .lb .stage img,.lb .stage .ph{max-height:100%;width:100%;height:100%;object-fit:contain}
  .lb .bar{color:#ddd;font-size:14px;margin-top:14px;letter-spacing:.1em}
  .lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:30px;padding:16px;cursor:pointer;opacity:.7}
  .lb .prev{left:0} .lb .next{right:0}

  /* location */
  .venue{font-size:18px;font-weight:700;margin-bottom:4px}
  .addr{font-size:15px;color:var(--soft)}
  .mapimg{margin:24px 0 0;width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden}
  .mapimg img{width:100%;height:100%;object-fit:cover}
  .maplinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .maplinks a{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);text-decoration:none;font-size:13px}
  .maplinks i{width:16px;height:16px;border-radius:4px;display:inline-block}
  .transport{margin-top:36px;text-align:left;display:grid;gap:22px}
  .transport h3{font-size:14px;font-weight:700;margin-bottom:4px;color:var(--accent)}
  .transport p{font-size:15px;white-space:pre-line}

  /* parking notice */
  .parking{margin-top:32px;text-align:left;border:2px solid var(--accent);border-radius:10px;overflow:hidden;background:var(--paper)}
  .parking .ph-head{background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:12px 18px;display:flex;align-items:center;gap:8px}
  .parking .ph-head svg{width:20px;height:20px;flex-shrink:0}
  .parking .ph-body{padding:16px 18px 18px}
  .parking .warn{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px;white-space:pre-line}
  .parking .warn em{font-style:normal;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .parking .pname{font-size:17px;font-weight:700}
  .parking .paddr{font-size:15px;color:var(--soft);margin-bottom:14px}
  .parking .pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .parking .pbtns .btn{border-radius:6px;padding:11px 8px}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-decoration:none}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

  /* accounts */
  .acc{border:1px solid var(--line);border-radius:8px;background:var(--paper);margin-bottom:10px;text-align:left;overflow:hidden}
  .acc summary{list-style:none;cursor:pointer;padding:15px 18px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  .acc summary::-webkit-details-marker{display:none}
  .acc summary::after{content:'＋';color:var(--soft);font-size:14px}
  .acc[open] summary::after{content:'－'}
  .acc .row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--line);gap:10px}
  .acc .row .t{font-size:13px;line-height:1.6}
  .acc .row .t small{display:block;color:var(--soft)}
  .acc .row .btn{padding:6px 12px;font-size:12px;flex-shrink:0}
  .note{font-size:15px;color:var(--soft);margin-bottom:28px;white-space:pre-line}

  /* extra links */
  .links{display:grid;gap:10px}
  .links a{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:8px;background:var(--paper);text-decoration:none;text-align:left}
  .links a b{font-weight:400;font-size:15px;display:block}
  .links a small{font-size:12px;color:var(--soft)}
  .links a::after{content:'→';color:var(--accent)}

  footer{padding:56px 28px calc(56px + env(safe-area-inset-bottom));text-align:center;border-top:1px solid var(--line);font-size:14px;color:var(--soft)}
  footer .btns{display:flex;gap:8px;justify-content:center;margin-bottom:28px}

  .toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(40,36,32,.9);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
  .fade.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}}
  [hidden]{display:none!important}
</style>
</head>
<body>

<!-- 커버 -->
<header class="cover">
  <p class="date-top"><b id="cv-date"></b><span id="cv-dow"></span></p>
  <div class="main" id="cv-photo"></div>
  <p class="names" id="cv-names"></p>
  <p class="meta" id="cv-meta"></p>
</header>

<!-- 인사말 -->
<section class="fade">
  <h2>소중한 분들을 초대합니다</h2>
  <p class="poem" id="poem"></p>
  <p class="greeting" id="greeting"></p>
  <div class="parents" id="parents"></div>
</section>

<!-- 예식 일시 -->
<section class="fade">
  <h2 id="cal-title"></h2>
  <p class="cal-head" id="cal-month"></p>
  <div class="cal" id="cal"></div>
  <div class="count" id="count"></div>
  <p class="dday" id="dday"></p>
</section>

<!-- 갤러리 -->
<section class="fade" id="sec-gallery">
  <h2>우리의 순간들</h2>
  <div class="gallery" id="gallery"></div>
  <button class="btn more" id="more" hidden>사진 더보기</button>
</section>

<!-- 오시는 길 -->
<section class="fade">
  <h2>오시는 길</h2>
  <p class="venue" id="venue"></p>
  <p class="addr" id="addr"></p>
  <button class="btn" style="margin-top:12px" id="copy-addr">주소 복사</button>
  <div class="mapimg" id="mapimg"></div>
  <div class="maplinks" id="maplinks"></div>
  <div class="parking" id="parking"></div>
  <div class="transport" id="transport"></div>
</section>

<!-- 마음 전하실 곳 -->
<section class="fade" id="sec-acc">
  <h2>마음 전하실 곳</h2>
  <p class="note" id="acc-note"></p>
  <div id="accounts"></div>
</section>

<!-- 추가 링크 -->
<section class="fade" id="sec-links">
  <h2 id="links-title"></h2>
  <div class="links" id="links"></div>
</section>

<footer>
  <div class="btns">
    <button class="btn solid" id="share">청첩장 링크 복사</button>
  </div>
  <p id="closing"></p>
</footer>

<!-- 사진 크게 보기 -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="x" id="lb-x" aria-label="닫기">×</button>
  <button class="nav prev" id="lb-prev" aria-label="이전">‹</button>
  <div class="stage" id="lb-stage"></div>
  <button class="nav next" id="lb-next" aria-label="다음">›</button>
  <p class="bar" id="lb-bar"></p>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ✏️  여기만 고치면 청첩장 내용이 바뀝니다
   - 사진: images 폴더에 파일을 넣고 경로를 적어 주세요 (예: "images/01.jpg")
           비워 두면("") 자리표시 이미지가 나옵니다.
   - 링크: 어떤 외부 주소든 넣을 수 있습니다 (네이버지도, 카카오맵, 송금, 라이브 등)
   ===================================================================== */
const CONFIG = {
  groom: { name: "김창혁", first: "창혁", father: "김윤도", mother: "박형자", order: "차남" },
  bride: { name: "차유진", first: "유진", father: "차진원", mother: "고은희", order: "차녀" },

  date: "2027-04-03T11:00:00+09:00",
  venue: "문학의 집·서울",
  hall: "",                                   // 예: "중앙홀" / "야외 정원"
  address: "서울특별시 중구 퇴계로26길 65",

  mainPhoto: "",                              // 예: "images/main.jpg"
  mapPhoto: "",                               // 약도 이미지가 있으면 "images/map.jpg"

  poem: "",                                    // 첫머리 글귀(시 구절 등). 비우면 생략
  greeting:
`서로 다른 길을 걸어온 두 사람이
이제 같은 곳을 바라보며 걸어가려 합니다.

봄빛 가득한 날,
저희의 새로운 시작을 함께 축복해 주시면
더없는 기쁨으로 간직하겠습니다.`,

  gallery: ["", "", "", "", "", "", "", "", ""],  // 예: ["images/01.jpg", "images/02.jpg", ...]
  galleryInitial: 9,                          // 처음에 보여줄 사진 수 (나머지는 '더보기')

  maps: [
    { label: "네이버 지도", color: "#03c75a", url: "https://map.naver.com/p/search/" + encodeURIComponent("문학의집 서울") },
    { label: "카카오맵",   color: "#fee500", url: "https://map.kakao.com/link/search/" + encodeURIComponent("문학의집서울") }
  ],

  transport: [
    { title: "지하철", text: "(예) ○호선 ○○역 ○번 출구 도보 ○분" },
    { title: "버스",   text: "(예) ○○번 ○○ 정류장 하차" },
  ],

  // 🚗 주차 안내 (예식장 주차장이 아닌 별도 주차장 — 강조 박스로 표시됩니다)
  parking: {
    title: "주차는 별도 주차장을 이용해 주세요",
    warn: "예식장 주차장이 협소하여 <em>하객분들의 주차가 어렵습니다.</em>\n차량으로 오시는 분은 아래 주차장을 이용해 주시기 바랍니다.",
    name: "대한적십자사 주차장",
    address: "서울 중구 소파로 145",
    mapUrl: "https://map.naver.com/p/search/" + encodeURIComponent("서울 중구 소파로 145")
  },

  accountNote:
`참석이 어려우신 분들을 위해 기재했습니다.
너그러운 마음으로 양해 부탁드립니다.`,
  accounts: {
    groom: [
      { who: "신랑 김창혁", bank: "○○은행", number: "000-0000-0000" },
      { who: "아버지 김윤도", bank: "○○은행", number: "000-0000-0000" }
    ],
    bride: [
      { who: "신부 차유진", bank: "○○은행", number: "000-0000-0000" },
      { who: "어머니 고은희", bank: "○○은행", number: "000-0000-0000" }
    ]
  },

  linksTitle: "함께 보면 좋은 곳",
  links: [                                     // 비워 두면([]) 섹션이 숨겨집니다
    // { title: "예식 생중계", desc: "유튜브 라이브", url: "https://youtube.com/..." },
    { title: "문학의 집·서울 안내", desc: "예식장 위치 · 주변 정보", url: "https://map.naver.com/p/search/" + encodeURIComponent("문학의집 서울") }
  ],

  closing: "함께해 주시는 모든 분들께 진심으로 감사드립니다."
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>';
const photo = (src, alt, label) => src
  ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.outerHTML=window.__ph('${esc(label)}')">`
  : __ph(label);
function __ph(label){ return `<div class="ph" style="width:100%;height:100%"><div class="phin">${PH_ICON}<span>${label||'사진'}</span></div></div>`; }
window.__ph = __ph;

const D = new Date(CONFIG.date);
const DOW_KO = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const hh = D.getHours(), ampm = hh < 12 ? '오전' : '오후', h12 = hh % 12 || 12, mm = D.getMinutes();
const timeKo = `${ampm} ${h12}시${mm ? ' ' + mm + '분' : ''}`;

/* cover */
$('cv-date').textContent = `${D.getFullYear()}.${pad(D.getMonth()+1)}.${pad(D.getDate())}`;
$('cv-dow').textContent = `${DOW_KO[D.getDay()]}요일 ${timeKo}`;
$('cv-photo').innerHTML = photo(CONFIG.mainPhoto, '메인 사진', '메인 사진');
$('cv-names').innerHTML = `${esc(CONFIG.groom.name)}<span>·</span>${esc(CONFIG.bride.name)}`;
$('cv-meta').textContent = `${CONFIG.venue}${CONFIG.hall ? ' ' + CONFIG.hall : ''}`;

/* greeting */
if (CONFIG.poem) $('poem').textContent = CONFIG.poem; else $('poem').hidden = true;
$('greeting').textContent = CONFIG.greeting;
const pLine = (p, side) => `<div class="p"><span class="side">${side}</span><span class="pp">${esc(p.father)} · ${esc(p.mother)}</span><span class="rel">의 ${esc(p.order)}</span><span class="who">${esc(p.first)}</span></div>`;
$('parents').innerHTML = pLine(CONFIG.groom, '신랑측') + '<span class="sep"></span>' + pLine(CONFIG.bride, '신부측');

/* calendar */
$('cal-title').textContent = `${D.getFullYear()}년 ${D.getMonth()+1}월 ${D.getDate()}일 ${DOW_KO[D.getDay()]}요일 ${timeKo}`;
$('cal-month').textContent = `${D.getFullYear()}년 ${D.getMonth()+1}월`;
(function(){
  const y = D.getFullYear(), m = D.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  let html = DOW_KO.map((d,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for (let i=0;i<first;i++) html += '<div></div>';
  for (let d=1; d<=days; d++){
    const w = (first + d - 1) % 7;
    html += `<div class="d ${w===0?'sun':w===6?'sat':''} ${d===D.getDate()?'on':''}"><span>${d}</span></div>`;
  }
  $('cal').innerHTML = html;
})();
function tick(){
  const diff = D - new Date();
  const g = CONFIG.groom.first, b = CONFIG.bride.first;
  if (diff <= 0){
    $('count').hidden = true;
    $('dday').innerHTML = `${esc(g)} ♥ ${esc(b)}의 결혼식이 <em>${Math.floor(-diff/864e5)===0?'오늘입니다':'있었습니다'}</em>.`;
    return;
  }
  const s = Math.floor(diff/1000);
  const parts = [['일',Math.floor(s/86400)],['시간',Math.floor(s%86400/3600)],['분',Math.floor(s%3600/60)],['초',s%60]];
  $('count').innerHTML = parts.map(([k,v])=>`<div><b>${k==='일'?v:pad(v)}</b><small>${k}</small></div>`).join('');
  const dday = Math.ceil((new Date(D.getFullYear(),D.getMonth(),D.getDate()) - new Date(new Date().toDateString()))/864e5);
  $('dday').innerHTML = `${esc(g)} ♥ ${esc(b)}의 결혼식이 <em>${dday}일</em> 남았습니다.`;
}
tick(); setInterval(tick, 1000);

/* gallery + lightbox */
const G = CONFIG.gallery;
let shown = Math.min(G.length, CONFIG.galleryInitial || G.length);
function renderGallery(){
  $('gallery').innerHTML = G.slice(0, shown).map((src,i)=>`<button data-i="${i}" aria-label="사진 ${i+1} 크게 보기">${photo(src, '사진 '+(i+1), String(i+1))}</button>`).join('');
  $('more').hidden = shown >= G.length;
}
if (!G.length) $('sec-gallery').hidden = true; else renderGallery();
$('more').onclick = () => { shown = G.length; renderGallery(); };
let cur = 0;
const openLb = i => { cur = i; drawLb(); $('lb').classList.add('open'); document.body.style.overflow='hidden'; };
const closeLb = () => { $('lb').classList.remove('open'); document.body.style.overflow=''; };
const drawLb = () => { $('lb-stage').innerHTML = photo(G[cur], '사진 '+(cur+1), String(cur+1)); $('lb-bar').textContent = `${cur+1} / ${G.length}`; };
const step = d => { cur = (cur + d + G.length) % G.length; drawLb(); };
$('gallery').onclick = e => { const b = e.target.closest('button'); if (b) openLb(+b.dataset.i); };
$('lb-x').onclick = closeLb; $('lb-prev').onclick = () => step(-1); $('lb-next').onclick = () => step(1);
$('lb').onclick = e => { if (e.target.id === 'lb') closeLb(); };
document.addEventListener('keydown', e => { if (!$('lb').classList.contains('open')) return; if (e.key==='Escape') closeLb(); if (e.key==='ArrowLeft') step(-1); if (e.key==='ArrowRight') step(1); });
let sx = null;
$('lb-stage').addEventListener('touchstart', e => sx = e.touches[0].clientX, {passive:true});
$('lb-stage').addEventListener('touchend', e => { if (sx===null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });

/* location */
$('venue').textContent = CONFIG.venue + (CONFIG.hall ? ' ' + CONFIG.hall : '');
$('addr').textContent = CONFIG.address;
if (CONFIG.mapPhoto) $('mapimg').innerHTML = photo(CONFIG.mapPhoto, '약도', '약도'); else $('mapimg').hidden = true;
$('maplinks').innerHTML = CONFIG.maps.map(m=>`<a href="${esc(m.url)}" target="_blank" rel="noopener"><i style="background:${esc(m.color||'#ccc')}"></i>${esc(m.label)}</a>`).join('');
if (CONFIG.maps.length % 2) $('maplinks').style.gridTemplateColumns = '1fr';
$('transport').innerHTML = CONFIG.transport.map(t=>`<div><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p>${t.link?`<a class="inline" href="${esc(t.link.url)}" target="_blank" rel="noopener">${esc(t.link.label)} →</a>`:''}</div>`).join('');

/* parking */
const PK = CONFIG.parking;
if (PK){
  const CAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 17h14M6 17v2M18 17v2M4 13l2-5a2 2 0 0 1 2-1.3h8A2 2 0 0 1 18 8l2 5v4H4z"/><circle cx="8" cy="14" r="1"/><circle cx="16" cy="14" r="1"/></svg>';
  $('parking').innerHTML = `<div class="ph-head">${CAR}${esc(PK.title)}</div><div class="ph-body">
    <p class="warn">${PK.warn}</p>
    <p class="pname">${esc(PK.name)}</p><p class="paddr">${esc(PK.address)}</p>
    <div class="pbtns"><a class="btn solid" href="${esc(PK.mapUrl)}" target="_blank" rel="noopener">주차장 지도 보기</a><button class="btn" data-copy-addr="${esc(PK.address)}">주차장 주소 복사</button></div></div>`;
} else $('parking').hidden = true;

/* accounts */
const accBlock = (title, list) => list.length ? `<details class="acc"><summary>${title}</summary>${list.map(a=>`<div class="row"><div class="t">${esc(a.bank)} ${esc(a.number)}<small>${esc(a.who)}</small></div><button class="btn" data-copy="${esc(a.bank+' '+a.number)}">복사</button></div>`).join('')}</details>` : '';
const accHtml = accBlock('신랑측 계좌번호', CONFIG.accounts.groom||[]) + accBlock('신부측 계좌번호', CONFIG.accounts.bride||[]);
if (accHtml) { $('accounts').innerHTML = accHtml; $('acc-note').textContent = CONFIG.accountNote; } else $('sec-acc').hidden = true;

/* extra links */
if (CONFIG.links && CONFIG.links.length){
  $('links-title').textContent = CONFIG.linksTitle;
  $('links').innerHTML = CONFIG.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener"><span><b>${esc(l.title)}</b>${l.desc?`<small>${esc(l.desc)}</small>`:''}</span></a>`).join('');
} else $('sec-links').hidden = true;

$('closing').textContent = CONFIG.closing;

/* copy helpers */
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1800); }
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove(); toast(ok ? okMsg : '복사가 지원되지 않아요: ' + text);
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) copy(b.dataset.copy, '계좌번호가 복사되었어요'); const a = e.target.closest('[data-copy-addr]'); if (a) copy(a.dataset.copyAddr, '주차장 주소가 복사되었어요'); });
$('copy-addr').onclick = () => copy(CONFIG.address, '주소가 복사되었어요');
$('share').onclick = () => copy(location.href.split('#')[0], '청첩장 링크가 복사되었어요');

/* fade-in */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12}) : null;
document.querySelectorAll('.fade').forEach(el => io ? io.observe(el) : el.classList.add('in'));
</script>
</body>
</html>
